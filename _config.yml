title: Traction Factory
description: Senior commercial consultancy for iGaming and technology businesses.
url: "https://tractionfactory.co"
baseurl: ""
timezone: Europe/Nicosia
markdown: kramdown
permalink: /articles/:title/
exclude:
  - README.md
  - PUBLISHING.md
  - Gemfile
  - Gemfile.lock
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Thomas Rhys Jones

# External services remain OFF until the receiving account is verified.
# Keep visitor mailto enquiries working until a Formspree account, a real
# submission endpoint, and successful email delivery are verified.
# To activate later: set form_delivery to "formspree" AND paste the official
# https://formspree.io/f/<form-id> URL into formspree_endpoint.
form_delivery: "mailto"
formspree_endpoint: ""
analytics_provider: "none"
# Obtain the current site-specific script URL from Plausible's dashboard.
plausible_script_src: ""
