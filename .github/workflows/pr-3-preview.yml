name: Isolated PR 3 visual preview

on:
  push:
    branches:
      - feature/conversion-credibility-nov-2026
  workflow_dispatch:

# This does NOT call deploy-pages or modify GitHub Pages hosting.
# The preview is a separately generated orphan branch, served by a development-only
# HTML mirror. The production domain is untouched.
permissions:
  contents: write

concurrency:
  group: traction-factory-pr-3-preview
  cancel-in-progress: true

jobs:
  static-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4

      - name: Build Jekyll site without deploying to Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Rebase internal links for the isolated preview URL
        env:
          PREVIEW_BASE: https://raw.githack.com/thomasrhysjones-hub/traction-factory-site/preview-pr-3
        run: python3 .github/scripts/prepare-preview.py

      - name: Publish generated output to preview-pr-3 branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/traction-factory-pr-3"
          cp -a _site/. "$RUNNER_TEMP/traction-factory-pr-3/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan preview-pr-3
          git rm -rf --ignore-unmatch .
          git clean -fdx
          cp -a "$RUNNER_TEMP/traction-factory-pr-3/." .
          touch .nojekyll
          git add -A
          git commit -m "Rendered preview of PR 3 from ${GITHUB_SHA}"
          git push --force origin HEAD:refs/heads/preview-pr-3

      - name: Display preview URL
        run: |
          echo 'Preview: https://raw.githack.com/thomasrhysjones-hub/traction-factory-site/preview-pr-3/' >> "$GITHUB_STEP_SUMMARY"
          echo 'Source changes remain unmerged. The production website has not been deployed.' >> "$GITHUB_STEP_SUMMARY"
